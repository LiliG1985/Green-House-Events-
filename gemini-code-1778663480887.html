<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Greenhouse Events Dubai — Luxury Event Production</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet"/>
    <style>
        /* BRAND COLORS INSPIRED BY YOUR LOGO */
        :root {
            --deep-teal: #3d4f4c;   
            --muted-teal: #536763;
            --gold-primary: #C9A84C;
            --gold-light: #F5E9B8;
            --gold-dark: #8B6914;
            --pearl: #D6CFC4;
            --warm-white: #F4F0E8;
            --gold-grad: linear-gradient(135deg, #8B6914 0%, #C9A84C 50%, #F5E9B8 100%);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        html { scroll-behavior: smooth; }

        body { 
            font-family: 'Jost', sans-serif; 
            background-color: var(--deep-teal); 
            color: var(--warm-white); 
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* NAVIGATION */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 5vw;
            background: rgba(61, 79, 76, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 0.5px solid rgba(201, 168, 76, 0.2);
        }

        .nav-logo { font-family: 'Cinzel', serif; color: var(--gold-primary); text-decoration: none; font-weight: 700; letter-spacing: 0.1em; }

        /* ATMOSPHERIC HERO */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at center, var(--muted-teal) 0%, var(--deep-teal) 100%);
            text-align: center;
            overflow: hidden;
        }

        /* LOGO INTEGRATION */
        .logo-container {
            position: relative;
            z-index: 10;
            width: min(650px, 90vw);
            padding: 2rem;
            animation: logoReveal 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        #lightBeams {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        .logo-frame {
            width: clamp(180px, 35vw, 300px);
            margin: 0 auto 1.5rem;
            filter: drop-shadow(0 0 20px rgba(201, 168, 76, 0.5));
            animation: pulse 6s ease-in-out infinite;
        }

        .brand-name {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.2rem, 5.5vw, 4.2rem);
            letter-spacing: 0.25em;
            font-weight: 700;
            background: var(--gold-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .brand-sub {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.9rem, 2vw, 1.6rem);
            letter-spacing: 0.55em;
            color: var(--pearl);
            border-top: 1px solid rgba(201, 168, 76, 0.3);
            border-bottom: 1px solid rgba(201, 168, 76, 0.3);
            display: inline-block;
            padding: 0.6rem 2.2rem;
            margin: 0.5rem 0;
        }

        .brand-location {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            letter-spacing: 0.9em;
            color: var(--gold-light);
            margin-top: 1rem;
            opacity: 0.8;
        }

        /* BUTTONS */
        .cta-group { margin-top: 3.5rem; display: flex; gap: 1.5rem; z-index: 15; opacity: 0; animation: fadeUp 1s 1.2s forwards; }

        .btn {
            padding: 1rem 2.5rem;
            text-transform: uppercase;
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-decoration: none;
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .btn-gold { background: var(--gold-grad); color: var(--deep-teal); font-weight: 700; border: none; }
        .btn-outline { border: 1px solid var(--gold-primary); color: var(--gold-primary); }
        .btn:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }

        @keyframes logoReveal { 0% { opacity: 0; transform: scale(0.9) translateY(20px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0%, 100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.03); } }

        @media (max-width: 600px) { .cta-group { flex-direction: column; gap: 1rem; } }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="nav-logo">GREENHOUSE EVENTS</a>
        <a href="#contact" class="btn btn-outline" style="padding: 0.5rem 1.2rem; font-size: 0.6rem;">Enquire</a>
    </nav>

    <section class="hero">
        <canvas id="lightBeams"></canvas>
        
        <div class="logo-container">
            <svg class="logo-frame" viewBox="0 0 340 280" fill="none">
                <path d="M50 220 L50 120 L170 60 L290 120 L290 220" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="50" y1="220" x2="290" y2="220" stroke="#C9A84C" stroke-width="1.5"/>
                <line x1="170" y1="220" x2="170" y2="62" stroke="#C9A84C" stroke-width="1.5"/>
                <circle cx="170" cy="235" r="4" fill="#C9A84C"/>
            </svg>

            <div class="logo-content">
                <h1 class="brand-name">GREENHOUSE</h1>
                <h2 class="brand-sub">EVENTS</h2>
                <div class="brand-location">DUBAI</div>
            </div>
        </div>

        <div class="cta-group">
            <a href="#contact" class="btn btn-gold">Plan Your Event</a>
            <a href="#services" class="btn btn-outline">Our Services</a>
        </div>
    </section>

    <script>
        (function() {
            const canvas = document.getElementById('lightBeams');
            const ctx = canvas.getContext('2d');
            let width, height, cx, cy;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                cx = width / 2;
                cy = height / 2;
            }

            window.addEventListener('resize', resize);
            resize();

            const beams = Array.from({ length: 14 }, () => ({
                angle: Math.random() * Math.PI * 2,
                speed: 0.002 + Math.random() * 0.004,
                spread: 0.15 + Math.random() * 0.35,
                opacity: Math.random() * Math.PI
            }));

            function draw() {
                ctx.clearRect(0, 0, width, height);
                beams.forEach(beam => {
                    beam.angle += beam.speed;
                    beam.opacity += 0.01;
                    const currentOpacity = (Math.sin(beam.opacity) * 0.5 + 0.5) * 0.3;
                    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, width * 0.6);
                    grad.addColorStop(0, `rgba(245, 233, 184, ${currentOpacity})`);
                    grad.addColorStop(1, 'rgba(61, 79, 76, 0)');

                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.arc(cx, cy, width, beam.angle, beam.angle + beam.spread);
                    ctx.lineTo(cx, cy);
                    ctx.fillStyle = grad;
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
        })();
    </script>
</body>
</html>
