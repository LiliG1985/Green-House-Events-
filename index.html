<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Greenhouse Events Dubai — Luxury Event Production</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #021612; 
            --bg-mid: #04241e;  
            --gold-metallic: linear-gradient(135deg, #8B6914 0%, #C9A84C 25%, #F5E9B8 50%, #C9A84C 75%, #8B6914 100%);
            --gold-solid: #C9A84C;
            --white-off: #F4F0E8;
            --border: rgba(201,168,76,0.18);
            --serif: 'Cormorant Garamond', serif;
            --display: 'Cinzel', serif;
            --sans: 'DM Sans', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        
        body { 
            background: var(--bg-deep); 
            color: var(--white-off); 
            font-family: var(--sans); 
            overflow-x: hidden; 
            line-height: 1.6; 
        }

        .metallic-gold {
            background: var(--gold-metallic);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% auto;
            animation: shine 5s linear infinite;
            display: inline-block;
            font-weight: 600;
        }
        @keyframes shine { to { background-position: 200% center; } }

        /* --- NAVIGATION --- */
        nav {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            padding: 1.2rem 5vw; display: flex; justify-content: space-between; align-items: center;
            background: rgba(2, 22, 18, 0.96); backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 0.5px solid var(--border);
        }
        
        .logo-wrap { text-decoration: none; display: inline-block; position: relative; padding-bottom: 4px; }
        .nav-logo { font-family: var(--serif); font-size: 1.15rem; font-weight: 600; letter-spacing: 3px; display: inline-block; white-space: nowrap; }
        .nav-actions { display: flex; align-items: center; gap: 1rem; }
        .nav-cta { background: var(--gold-metallic); color: #0b1a18; padding: 0.55rem 1.4rem; text-decoration: none; font-weight: 600; font-size: 0.7rem; letter-spacing: 1px; }

        /* --- HERO HEADER --- */
        .hero {
            height: 100vh; position: relative; display: flex; align-items: center; justify-content: center;
            background: #021612 url('logo.jpg') no-repeat center center; background-size: contain; padding: 10vh 10vw; 
            z-index: 5;
        }
        .hero-overlay { position: absolute; inset: 0; background: radial-gradient(circle, transparent 40%, rgba(2, 22, 18, 0.6) 100%); }

        /* --- TEXT RUNNING MARQUEE --- */
        .marquee { 
            background: #00120f; padding: 1.2rem 0; overflow: hidden; white-space: nowrap; border-top: 0.5px solid var(--gold-solid); border-bottom: 0.5px solid var(--gold-solid); display: flex;
            position: relative; z-index: 10;
        }
        .marquee-inner { 
            display: inline-block; animation: scroll-text 45s linear infinite; font-family: var(--serif); color: var(--gold-solid); font-size: 1.1rem; letter-spacing: 4px; text-transform: uppercase; padding-right: 2rem; flex-shrink: 0;
        }

        /* --- IMAGE SLIDING MARQUEE --- */
        .image-marquee { width: 100%; background: #00120f; padding: 2.5rem 0; overflow: hidden; white-space: nowrap; display: flex; border-bottom: 0.5px solid var(--border); position: relative; z-index: 10; }
        .image-marquee-track { display: flex; gap: 1.5rem; animation: scroll-images 45s linear infinite; flex-shrink: 0; padding-right: 1.5rem; }
        .image-marquee-track img { width: 380px; height: 240px; object-fit: cover; border: 0.5px solid var(--border); }

        section { padding: 8rem 8vw; position: relative; }

        /* --- RICH BOTANICAL GREEN CANVAS --- */
        .living-content-wall {
            position: relative;
            background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 40%, var(--bg-deep) 100%);
            width: 100%;
        }

        @keyframes scroll-text { from { transform: translateX(0); } to { transform: translateX(-100%); } }
        @keyframes scroll-images { from { transform: translateX(0); } to { transform: translateX(-100%); } }

        /* --- PRODUCTION CARD GRID --- */
        #services { 
            padding: 8rem 8vw; 
            border-bottom: 0.5px solid var(--border);
            position: relative;
            z-index: 5;
            background: transparent !important;
        } 
        .sec-title { font-family: var(--serif); font-size: 3.5rem; margin-bottom: 3rem; text-align: center; font-weight: 300; position: relative; z-index: 5; }
        .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; position: relative; z-index: 5; }
        
        .card { 
            text-decoration: none; color: inherit; border: 0.5px solid var(--border); padding: 2.5rem 1.8rem; 
            background: rgba(1, 10, 8, 0.9);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); display: flex; flex-direction: column; justify-content: flex-start; cursor: pointer;
            box-shadow: 0 20px 45px rgba(0,0,0,0.6);
        }
        .card:hover { border-color: var(--gold-solid); transform: translateY(-8px); background: rgba(3, 23, 19, 0.95); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8); z-index: 10; }
        .card h3 { font-family: var(--serif); font-size: 1.4rem; margin-bottom: 1.2rem; line-height: 1.3; min-height: 4.4rem; }
        .card p { font-size: 0.88rem; opacity: 0.75; margin-bottom: 1.5rem; line-height: 1.6; min-height: 5.5rem; }

        .card-img-space {
            width: 100%; aspect-ratio: 16/11; background: rgba(1, 10, 8, 0.6); border: 0.5px solid rgba(201, 168, 76, 0.3); margin-bottom: 1.5rem; overflow: hidden; margin-top: auto; position: relative; display: flex; align-items: center; justify-content: center;
        }
        .card-img-space img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; z-index: 2; }

        /* --- CLIENT SHOWCASE --- */
        #clients { padding: 8rem 5vw 8rem 5vw; position: relative; z-index: 5; background: transparent !important; }
        .client-container { display: flex; max-width: 1300px; margin: 0 auto; border: 0.5px solid var(--border); background: rgba(1, 10, 8, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 25px 50px rgba(0,0,0,0.6); overflow: hidden; }
        .client-sidebar { background: #000c0a; width: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 0.5px solid var(--border); flex-shrink: 0; padding: 50px 0; }
        .client-sidebar h2 { font-family: var(--display); font-size: 2.4rem; writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: 0.22em; text-transform: uppercase; }
        .client-image-wrap { flex-grow: 1; display: flex; align-items: center; justify-content: center; background: transparent; }
        .client-image-wrap img { width: 100%; height: auto; display: block; }

        /* --- STATS & DATA COUNTERS --- */
        .stats-bar { background
