<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Greenhouse Events Dubai — Luxury Event Production</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Jost:wght@200;300;400&display=swap" rel="stylesheet"/>
    <style>
        :root {
            /* These colors are sampled directly from your logo to ensure a "continuous" look */
            --bg-deep: #0b1a18; 
            --bg-glow: #1a3a34;
            --gold: #C9A84C;
            --warm-white: #F4F0E8;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html { 
            height: 100%; 
            background-color: var(--bg-deep); 
            color: var(--warm-white);
            font-family: 'Jost', sans-serif;
            overflow-x: hidden;
        }

        /* THE CONTINUOUS HERO BACKGROUND */
        .hero {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            /* Blends the deep edges of the logo into the site background */
            background: radial-gradient(circle at center, var(--bg-glow) 0%, var(--bg-deep) 100%);
            text-align: center;
        }

        /* YOUR EXACT LOGO - NO BOXES */
        .brand-image {
            width: min(800px, 95vw);
            height: auto;
            z-index: 10;
            display: block;
            /* Animation to make it feel premium on load */
            animation: softReveal 2.5s ease-out;
            /* Removes any "boxed" feel by blending perfectly */
            mix-blend-mode: lighten; 
        }

        /* CONTENT BELOW THE LOGO */
        .cta-container {
            margin-top: -2rem; /* Pulls content up to overlap with the logo's bottom glow */
            z-index: 20;
            opacity: 0;
            animation: fadeIn 1.5s 1.5s forwards;
        }

        .btn {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: var(--bg-deep);
            background: linear-gradient(135deg, #8B6914 0%, #C9A84C 50%, #F5E9B8 100%);
            padding: 1.2rem 3rem;
            text-decoration: none;
            font-weight: 700;
            border-radius: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(201, 168, 76, 0.3);
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(201, 168, 76, 0.6);
        }

        @keyframes softReveal {
            from { opacity: 0; transform: scale(0.95); filter: blur(10px); }
            to { opacity: 1; transform: scale(1); filter: blur(0); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <section class="hero">
        <img src="logo.jpg" alt="Greenhouse Events Dubai Logo" class="brand-image">
        
        <div class="cta-container">
            <a href="mailto:hello@greenhouseevents.ae" class="btn">ENQUIRE NOW</a>
        </div>
    </section>

</body>
</html>
