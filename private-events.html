<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Private Party and Event Planning — Greenhouse Events</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #021612; 
            --bg-mid: #04241e;  
            --gold-metallic: linear-gradient(135deg, #8B6914 0%, #C9A84C 25%, #F5E9B8 50%, #C9A84C 75%, #8B6914 100%);
            --gold-solid: #C9A84C;
            --white-off: #F4F0E8;
            --border: rgba(201,168,76,0.3);
            --serif: 'Cormorant Garamond', serif;
            --display: 'Cinzel', serif;
            --sans: 'DM Sans', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        
        /* --- ACCURATE SAGE MINT PLASTER BACKGROUND & BRAND TEXTURE --- */
        body { 
            background: 
                radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(2, 22, 18, 0.05) 0%, transparent 60%),
                repeating-radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.15) 0px, rgba(255, 255, 255, 0.15) 2px, transparent 4px, transparent 10px),
                #a4b9b5 !important;
            background-size: cover;
            background-attachment: fixed !important;
            color: #021612 !important; 
            font-family: var(--sans); 
            overflow-x: hidden; 
            line-height: 1.6; 
        }

        .metallic-gold {
            background: var(--gold-metallic);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% auto;
            animation: shine 5s linear infinite;
            display: inline-block;
            font-weight: 600;
        }
        @keyframes shine { to { background-position: 200% center; } }

        /* --- IMMACULATE SOLID GOLD THIN DIVIDER LINE --- */
        .gold-line {
            width: 90px;
            height: 1px;
            background-color: var(--gold-solid);
            margin: 1rem 0 2rem 0;
            display: block;
        }

        /* --- NAVIGATION --- */
        nav {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            padding: 1.2rem 5vw; display: flex; justify-content: space-between; align-items: center;
            background: rgba(164, 185, 181, 0.96); backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--gold-solid);
        }
        
        .logo-wrap { text-decoration: none; display: inline-block; position: relative; padding-bottom: 4px; }
        .nav-logo { font-family: var(--serif); font-size: 1.15rem; font-weight: 600; letter-spacing: 3px; display: inline-block; white-space: nowrap; }
        .nav-actions { display: flex; align-items: center; gap: 1.5rem; }
        .nav-actions a.nav-whatsapp { color: #021612; text-decoration: none; font-size: 0.8rem; letter-spacing: 1px; font-weight: 500; }
        .nav-cta { background: var(--gold-metallic); color: #0b1a18; padding: 0.55rem 1.4rem; text-decoration: none; font-weight: 600; font-size: 0.7rem; letter-spacing: 1px; }

        /* --- CONCIERGE FOOTER BUTTON DESIGN SHAPES --- */
        .nav-whatsapp-btn {
            background: rgba(255, 255, 255, 0.85); border: 0.5px solid var(--gold-solid); color: #021612; padding: 0.75rem 2rem; text-decoration: none; font-weight: 500; font-size: 0.8rem; letter-spacing: 1px; display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s ease; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 5px 15px rgba(2, 22, 18, 0.05);
        }
        .nav-whatsapp-btn:hover { background: rgba(201, 168, 76, 0.1); transform: translateY(-1px); }
        .nav-whatsapp-btn svg { width: 14px; height: 14px; fill: #021612; }

        .nav-email-btn {
            background: rgba(255, 255, 255, 0.85); border: 0.5px solid rgba(2, 22, 18, 0.3); color: #021612; padding: 0.75rem 2rem; text-decoration: none; font-weight: 500; font-size: 0.8rem; letter-spacing: 1px; display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s ease; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 5px 15px rgba(2, 22, 18, 0.05);
        }
        .nav-email-btn:hover { background: rgba(2, 22, 18, 0.05); transform: translateY(-1px); }
        .nav-email-btn svg { width: 14px; height: 14px; fill: #021612; }

        /* --- HERO HEADER COVER AREA --- */
        .hero {
            height: 100vh; 
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            background: linear-gradient(rgba(164, 185, 181, 0.1) 0%, rgba(164, 185, 181, 0.6) 100%), url('private-header-bg.jpg') no-repeat center center; 
            background-size: cover; 
            padding: 0 8vw; 
            z-index: 5;
            border-bottom: 0.5px solid var(--border);
        }
        .hero-content {
            text-align: center;
            max-width: 900px;
            z-index: 10;
        }
        .hero-content h1 {
            font-family: var(--serif);
            font-size: 4.5rem;
            font-weight: 300;
            margin-bottom: 2rem;
            letter-spacing: 3px;
            line-height: 1.15;
        }
